<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>デモ表示確認</title><style>html,body{margin:0;height:100%;background:#dce3ed;font-family:sans-serif}header{height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold}main{height:calc(100% - 40px);overflow:auto}iframe{display:block;margin:0 auto;border:0;background:white;height:100%;min-height:700px}</style><header id="label"></header><main><iframe id="demo" title="デモサイト"></iframe></main><script>const p=new URLSearchParams(location.search),roles={admin:'管理者',coach:'コーチ',member:'会員',officer:'役員'},role=roles[p.get('view')]?p.get('view'):'member',mobile=p.get('device')==='mobile',label=roles[role]+'・'+(mobile?'スマホ':'PC');document.title=label;document.getElementById('label').textContent=label+'（'+(mobile?'390':'1280')+'px）';const frame=document.getElementById('demo');frame.style.width=(mobile?390:1280)+'px';frame.src='./?view='+role+'#dashboard';</script></html>
