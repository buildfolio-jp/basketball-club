<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>デモ表示確認</title><style>html,body{margin:0;height:100%;background:#dce3ed;font-family:sans-serif}body{display:flex;flex-direction:column}header{flex-shrink:0;padding:8px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:14px}nav{display:flex;gap:5px;flex-wrap:wrap}a,button,select{border:1px solid #b7c8df;border-radius:5px;padding:7px;background:white;color:#18345a;text-decoration:none;font:inherit}a[aria-current=page]{background:#174e91;color:white}main{flex:1;min-height:0;overflow:auto}iframe{display:block;margin:0 auto;border:0;background:white;height:100%;min-height:700px}#label{font-weight:bold}</style><header><span id="label"></span><nav id="roles" aria-label="役割の切り替え"></nav><nav id="devices" aria-label="表示サイズの切り替え"></nav><label>デモ利用者 <select id="account"></select></label><button id="reload" type="button">画面を再読込</button></header><main><iframe id="demo" title="デモサイト"></iframe></main><script>
const p=new URLSearchParams(location.search),roles={admin:'管理者',coach:'コーチ',member:'会員',officer:'役員'},role=roles[p.get('view')]?p.get('view'):'member',mobile=p.get('device')==='mobile',device=mobile?'mobile':'desktop',label=roles[role]+'・'+(mobile?'スマホ':'PC'),groups=['男子A','男子B','女子U９','女子U12','U15アドバンス','U15ベーシック','体験'];
const accounts=role==='member'?groups.map((g,i)=>['member0'+(i+1),g]):role==='coach'?[1,2,3].map(i=>['coach0'+i,'コーチ'+i]):role==='officer'?[1,2].map(i=>['officer0'+i,'役員'+i]):[['admin01','管理者']];
const selected=accounts.some(x=>x[0]===p.get('account'))?p.get('account'):accounts[0][0];
document.title=label;document.getElementById('label').textContent=label;
function addLink(nav,text,url,active){const a=document.createElement('a');a.textContent=text;a.href=url;if(active)a.setAttribute('aria-current','page');document.getElementById(nav).append(a);}
for(const [key,name] of Object.entries(roles))addLink('roles',name,'?view='+key+'&device='+device,key===role);
for(const [key,name] of [['desktop','PC'],['mobile','スマホ']])addLink('devices',name,'?view='+role+'&device='+key+'&account='+selected,key===device);
const select=document.getElementById('account');for(const [id,name] of accounts){const option=new Option(name,id);option.selected=id===selected;select.add(option);}select.onchange=()=>location.href='?view='+role+'&device='+device+'&account='+select.value;
const frame=document.getElementById('demo');frame.style.width=(mobile?390:1280)+'px';frame.src='./?view='+role+'&account='+selected+'#dashboard';document.getElementById('reload').onclick=()=>frame.contentWindow.location.reload();
</script></html>
